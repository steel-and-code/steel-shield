# Steel Shield: start after the built-in definitions are in place, and if the
# updater stops (no network yet, a mirror hiccup), try again in 10 minutes
# instead of staying off until the next restart.
[Unit]
After=steel-shield-definitions.service
Wants=steel-shield-definitions.service
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10min
